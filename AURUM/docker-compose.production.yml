services:
  redis:
    image: ${AURUM_REDIS_IMAGE:?Set an immutable redis image reference with @sha256}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    volumes:
      - redis_data:/data
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  timescaledb:
    image: ${AURUM_TIMESCALE_IMAGE:?Set an immutable timescale image reference with @sha256}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the deployment secret manager}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the deployment secret manager}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - aurum_timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: ${AURUM_API_IMAGE:?Set an immutable AURUM API image reference with @sha256}
    environment:
      AURUM_ENV: production
      AURUM_MARKET_DATA_MODE: ${AURUM_MARKET_DATA_MODE:?Set LIVE or PAPER only after provider approval}
      TIMESCALE_DATABASE_HOST: timescaledb
      TIMESCALE_DATABASE_PORT: "5432"
      TIMESCALE_DATABASE_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in the deployment secret manager}
      TIMESCALE_DATABASE_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the deployment secret manager}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - postgres_password
      - redis_password
      - openai_api_key
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  dashboard:
    image: ${AURUM_DASHBOARD_IMAGE:?Set an immutable AURUM dashboard image reference with @sha256}
    environment:
      AURUM_ENV: production
      AURUM_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  postgres_password:
    external: true
  redis_password:
    external: true
  openai_api_key:
    external: true

volumes:
  redis_data:
  aurum_timescale_data:
