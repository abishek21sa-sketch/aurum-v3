project:
  name: AURUM
  environment: research

paths:
  data_dir: data
  results_dir: results

database:
  enabled: false
  host: localhost
  port: 5432
  name: aurum
  user: postgres

redis:
  enabled: false
  host: localhost
  port: 6379
  db: 0

market_data:
  tickers:
    - SPY
    - QQQ
    - DIA
    - TLT
    - GLD
    - VIX
    - BTC-USD
    - ETH-USD
  lookback_days: 1825

pipeline:
  fail_fast: false
  log_runtime: true
  save_artifacts: true
