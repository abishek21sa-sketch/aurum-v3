name: AURUM Enterprise Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AURUM
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: AURUM/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run enterprise acceptance gate
        run: python scripts/rc3_windows_acceptance.py

      - name: Verify release manifest
        run: python scripts/verify_enterprise_release.py
